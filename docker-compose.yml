services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-akademia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-akademia_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [ akademia_net ]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on: [ db, redis ]
    networks: [ akademia_net ]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [ backend ]
    ports:
      - "3003:3003"
    networks: [ akademia_net ]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [ akademia_net ]
    volumes:
      - redis_data:/data

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info
    depends_on: [ db, redis ]
    networks: [ akademia_net ]

networks:
  akademia_net:
    driver: bridge

volumes:
  db_data:
  redis_data:
